name: Atualizar base cartográfica

on:
  schedule:
    # 06:00 America/Campo_Grande (UTC-4) = 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Baixar GPKG atualizado
        run: python3 scripts/baixar_gpkg.py

      - name: Gerar GeoJSON (lotes fiscais e eixo viário)
        run: python3 scripts/gerar_geojson.py

      # Arquivos grandes (.gpkg e lotes_fiscais.geojson, ~200MB e ~100MB) vão
      # como assets de uma Release "latest" — não contam na cota de Git LFS
      # e ganham URL de download estável, sobrescrita a cada execução.
      - name: Publicar arquivos grandes na Release "latest"
        run: |
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Base cartográfica — versão mais recente" \
              --notes "Atualizado automaticamente todo dia útil. Não use uma tag específica — sempre aponte para 'latest'."
          fi
          gh release upload latest --repo "$GITHUB_REPOSITORY" --clobber \
            dados/gpkg/Mapa_GeoDourados.gpkg \
            dados/geojson/lotes_fiscais.geojson

      # O eixo viário é pequeno (~11MB) — fica versionado no próprio git,
      # o que permite ver o histórico de mudanças e renderiza direto no GitHub.
      - name: Commit do GeoJSON leve se houve mudança
        run: |
          git config user.name "geodourados-bot"
          git config user.email "geodourados-bot@users.noreply.github.com"
          git add dados/geojson/eixo_viario.geojson
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no eixo viário — nada para commitar."
          else
            git commit -m "Atualização automática do eixo viário"
            git push
          fi
